name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, Main]
  pull_request:
    branches: [main, Main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Verify toolchain and entry point
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          python --version
          python -m pip --version
          python -c "import platform, struct, sys; print(sys.executable); print(platform.platform()); assert sys.version_info[:2] == (3, 12); assert sys.platform == 'win32'; assert struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @('pyproject.toml', 'src/download_organizer/launcher.py', 'src/download_organizer/gui.py', 'tests')) {
            if (-not (Test-Path $path)) { throw "Required path missing: $path" }
          }

      - name: Install project and development dependencies
        run: |
          python -m pip install -e ".[dev]" *>&1 | Tee-Object -FilePath ci-logs/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Tee-Object -FilePath ci-logs/packages.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from download_organizer.gui import main; from download_organizer import launcher; import tkinter; assert callable(main); assert launcher.main is main; print('Entry point import OK; Tk', tkinter.TkVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pytest before packaging
        run: |
          python -m pytest -v -ra --junitxml=ci-logs/pytest.xml *>&1 | Tee-Object -FilePath ci-logs/pytest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build single GUI executable
        run: |
          python -m PyInstaller --version
          python -m PyInstaller --noconfirm --clean --onefile --windowed --log-level INFO --name DownloadOrganizer --paths src src/download_organizer/launcher.py *>&1 | Tee-Object -FilePath ci-logs/pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/DownloadOrganizer.exe)) { throw 'DownloadOrganizer.exe was not created' }
          python -c "from pathlib import Path; import struct; p=Path('dist/DownloadOrganizer.exe'); b=p.read_bytes(); assert b[:2] == b'MZ'; off=struct.unpack_from('<I', b, 0x3c)[0]; assert b[off:off+4] == b'PE\x00\x00'; assert struct.unpack_from('<H', b, off+4)[0] == 0x8664, 'Expected x64 PE'; assert struct.unpack_from('<H', b, off+24+68)[0] == 2, 'Expected Windows GUI subsystem'; print(p, p.stat().st_size, 'bytes; x64 GUI PE verified')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/DownloadOrganizer.exe -Algorithm SHA256 | Format-List | Out-String | Tee-Object -FilePath ci-logs/exe-sha256.txt

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOrganizer-Windows
          path: dist/DownloadOrganizer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DownloadOrganizer-build-logs
          path: |
            ci-logs/
            build/DownloadOrganizer/warn-DownloadOrganizer.txt
            build/DownloadOrganizer/xref-DownloadOrganizer.html
          if-no-files-found: warn
          retention-days: 14
