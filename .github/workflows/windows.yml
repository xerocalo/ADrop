name: Windows tests and EXE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -v
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DownloadOrganizer --paths src src/download_organizer/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: DownloadOrganizer-Windows
          path: dist/DownloadOrganizer.exe
          if-no-files-found: error
